name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -A clippy::collapsible-if -A clippy::too-many-arguments -A clippy::redundant-locals -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm pack --dry-run --json
