name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            requested="${{ inputs.version }}"
            expected="${requested#v}"
          fi
          if [[ -z "$expected" ]]; then
            echo "No release version supplied; validating build only."
            exit 0
          fi
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          npm_version="$(node -p "require('./package.json').version")"
          test "$cargo_version" = "$expected" || { echo "Cargo.toml is $cargo_version, expected $expected"; exit 1; }
          test "$npm_version" = "$expected" || { echo "package.json is $npm_version, expected $expected"; exit 1; }

  build:
    needs: validate
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: skyport-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: skyport-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: skyport-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: skyport-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: skyport-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          fi
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip (unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/skyport || true

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            cp target/${{ matrix.target }}/release/skyport.exe dist/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/skyport dist/${{ matrix.asset }}
          fi
          chmod +x dist/${{ matrix.asset }} || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum skyport-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare npm package
        run: |
          npm test
          npm pack --dry-run --json

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
