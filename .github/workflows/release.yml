name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            requested="${{ inputs.version }}"
            expected="${requested#v}"
          fi
          if [[ -z "$expected" ]]; then
            echo "No release version supplied; validating build only."
            exit 0
          fi
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          npm_version="$(node -p "require('./package.json').version")"
          test "$cargo_version" = "$expected" || { echo "Cargo.toml is $cargo_version, expected $expected"; exit 1; }
          test "$npm_version" = "$expected" || { echo "package.json is $npm_version, expected $expected"; exit 1; }

      - name: Test installer platform detection
        shell: sh
        run: |
          export SKYPORT_INSTALL_LIB_ONLY=1
          . ./install.sh
          unset ANDROID_ROOT ANDROID_DATA
          test "$(platform_target Linux x86_64 GNU/Linux)" = "x86_64-unknown-linux-gnu"
          ANDROID_ROOT=/system
          export ANDROID_ROOT
          test "$(platform_target Linux aarch64 GNU/Linux)" = "aarch64-linux-android"
          unset ANDROID_ROOT
          test "$(platform_target Linux arm64 Android)" = "aarch64-linux-android"

  build:
    needs: validate
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: skyport-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: skyport-aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-linux-android
            asset: skyport-aarch64-linux-android
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: skyport-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: skyport-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: skyport-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StrawberryPerl = "C:\Strawberry\perl\bin"
          if (-not (Test-Path "$StrawberryPerl\perl.exe")) {
            throw "Strawberry Perl is required to build vendored OpenSSL"
          }
          $env:Path = "$StrawberryPerl;$env:Path"
          perl -MLocale::Maketext::Simple -e 1
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          fi
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            test -n "${ANDROID_NDK_LATEST_HOME:-}" || {
              echo "ANDROID_NDK_LATEST_HOME is not available on this runner"
              exit 1
            }
            toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            linker="$toolchain/aarch64-linux-android24-clang"
            test -x "$linker"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
            export CC_aarch64_linux_android="$linker"
            export CXX_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang++"
            export AR_aarch64_linux_android="$toolchain/llvm-ar"
            export RANLIB_aarch64_linux_android="$toolchain/llvm-ranlib"
          fi
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip (unix)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-linux-android'
        run: strip target/${{ matrix.target }}/release/skyport || true

      - name: Verify Android ABI
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/skyport"
          headers="$(readelf -lW "$binary")"
          printf '%s\n' "$headers"
          grep -Fq '[Requesting program interpreter: /system/bin/linker64]' <<<"$headers"
          tls_alignment="$(awk '$1 == "TLS" { print $NF; exit }' <<<"$headers")"
          if [ -n "$tls_alignment" ] && (( tls_alignment < 64 )); then
            echo "Android ARM64 TLS alignment is $tls_alignment; expected at least 0x40"
            exit 1
          fi
          echo "Verified Android ARM64 interpreter and TLS alignment (${tls_alignment:-no PT_TLS segment})."

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            cp target/${{ matrix.target }}/release/skyport.exe dist/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/skyport dist/${{ matrix.asset }}
          fi
          chmod +x dist/${{ matrix.asset }} || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum skyport-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare npm package
        run: |
          npm test
          npm pack --dry-run --json

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
